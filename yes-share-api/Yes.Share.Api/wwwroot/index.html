<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yes.Share - 局域网文件共享</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/highlight.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login View -->
    <div id="login-view" class="container mt-5" style="max-width: 400px;">
        <div class="text-end mb-2">
             <select class="form-select form-select-sm d-inline-block" style="width: auto;" onchange="setLang(this.value)" id="lang-select-login">
                <option value="zh-CN">中文</option>
                <option value="en-US">English</option>
            </select>
        </div>
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title text-center mb-4" id="login-title">Yes.Share 登录</h3>
                <form id="login-form">
                    <div class="mb-3">
                        <label class="form-label" id="lbl-username">用户名</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" id="lbl-password">密码</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary" id="btn-login">登录</button>
                        <button type="button" class="btn btn-secondary" id="btn-register-mode">注册</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App View -->
    <div id="app-view" class="d-none">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Yes.Share</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" data-page="files" id="nav-files">文件列表</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="dashboard" id="nav-dashboard">系统看板</a>
                        </li>
                    </ul>
                    <div class="d-flex align-items-center">
                        <select class="form-select form-select-sm me-3" style="width: auto;" onchange="setLang(this.value)" id="lang-select">
                            <option value="zh-CN">中文</option>
                            <option value="en-US">English</option>
                        </select>
                        <div class="d-flex align-items-center me-3" id="repo-links">
                            <a class="repo-link me-2" href="https://gitee.com/ndkkztf/yes-share.git" target="_blank" rel="noopener noreferrer" aria-label="Gitee" title="Gitee">
                                <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <rect x="2.5" y="2.5" width="19" height="19" rx="4" fill="#C71D23"></rect>
                                    <path d="M7 12c0-2.761 2.239-5 5-5h5v3h-5a2 2 0 1 0 0 4h3v-1.5h-2v-2h5v6h-6a5 5 0 0 1-5-5z" fill="#FFFFFF"></path>
                                </svg>
                            </a>
                            <a class="repo-link text-white" href="https://github.com/guofanw/yesShare.git" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
                                <svg width="20" height="20" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.56 7.56 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"></path>
                                </svg>
                            </a>
                        </div>
                        <span class="navbar-text me-3" id="user-display"></span>
                        <button class="btn btn-outline-light btn-sm" id="btn-logout">退出</button>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container mt-4" id="content-area">
            <!-- Dynamic Content -->
        </div>
    </div>

    <!-- Image Preview Tooltip (Removed) -->
    <!-- <div id="img-preview-tooltip" class="img-preview-tooltip">
        <img id="img-preview-image" src="" alt="Preview">
    </div> -->

    <!-- Modals -->
    <div class="modal fade" id="previewModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-preview-title">文件预览</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <pre><code id="preview-content"></code></pre>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="btn-copy-preview">复制全文</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btn-close-preview">关闭</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Image Preview Modal -->
    <div class="modal fade" id="imagePreviewModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content bg-transparent border-0 shadow-none">
                <div class="modal-body p-0 text-center position-relative">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" style="z-index: 10; background-color: rgba(0,0,0,0.5); padding: 10px;"></button>
                    <img id="preview-image-modal-img" src="" class="img-fluid rounded shadow-lg" alt="Preview">
                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/highlight.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
